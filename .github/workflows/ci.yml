# WArmy CI — typecheck + build
#
# 注意（曾经导致 CI 全红）：根 package.json 里有
#   "packageManager": "pnpm@10.23.0"
# 而 pnpm/action-setup 若再传 version: 10，会报
#   ERR_PNPM_BAD_PM_VERSION (Multiple versions of pnpm specified)
# ⇒ **不要**在这里传 version，让 action 读 packageManager 字段（单一来源）。
name: ci

# 最小权限：默认只读仓库；任何需要写权限的 job 必须逐项显式申请。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # 允许在 Actions 页手动重跑（排查/复核时不必为触发 CI 而空推一个 commit）
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      # 动作版本：用声明 Node 24 运行时的新主版本，
      # 避免 GitHub 的 "Node.js 20 is deprecated" 警告（老版本动作仍在 node20 上跑）。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6          # 不传 version：由 package.json#packageManager 决定
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # 注意（两条都是真机环境差异，不是代码问题）：
      # 1) pnpm-lock.yaml 在**没有 pnpm 的机器**上被手工同步过（Electron 33 → 40），
      #    用 --no-frozen-lockfile 让 pnpm 自行解析 electron@40 的子树。
      #    等有 pnpm 的机器执行 `pnpm install --lockfile-only` 后可改回 frozen。
      # 2) --ignore-scripts：CI runner 没有 Visual Studio，better-sqlite3 无法从源码编译，
      #    Electron 也不下载二进制。本项目桌面主/渲染进程**零原生模块**，
      #    静态与逻辑门禁不需要这些原生产物。
      #    → 依赖真机 Electron 的两个门禁（runtime-errors / live-ui）**只在本地**跑：
      #       %TEMP%\warmy-verify-rounds.py（本轮实测 16 门禁 × 3 轮全绿）
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build
