# WArmy CI — typecheck + build + verify
#
# 注意（曾经导致 CI 全红）：根 package.json 里有
#   "packageManager": "pnpm@10.23.0"
# 而 pnpm/action-setup 若再传 version: 10，会报
#   ERR_PNPM_BAD_PM_VERSION (Multiple versions of pnpm specified)
# ⇒ **不要**在这里传 version，让 action 读 packageManager 字段（单一来源）。
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拉全历史与 tag：spikes/verify-all 会检查版本 tag（默认浅克隆没有 tag）
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4          # 不传 version：由 package.json#packageManager 决定
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # 注意（两条都是真机环境差异，不是代码问题）：
      # 1) pnpm-lock.yaml 在**没有 pnpm 的机器**上被手工同步过（Electron 33 → 40），
      #    用 --no-frozen-lockfile 让 pnpm 自行解析 electron@40 的子树。
      #    等有 pnpm 的机器执行 `pnpm install --lockfile-only` 后可改回 frozen。
      # 2) --ignore-scripts：CI runner 没有 Visual Studio，better-sqlite3 无法从源码编译，
      #    Electron 也不下载二进制。本项目桌面主/渲染进程**零原生模块**，
      #    静态与逻辑门禁不需要这些原生产物。
      #    → 依赖真机 Electron 的两个门禁（runtime-errors / live-ui）**只在本地**跑：
      #       %TEMP%\warmy-verify-rounds.py（本轮实测 16 门禁 × 3 轮全绿）
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build
      # 静态/一致性门禁（快、稳）
      - name: verify docs
        run: node packages/app-shell/scripts/verify-docs.mjs
      - name: verify i18n locales
        run: node packages/app-shell/scripts/verify-i18n-locales.mjs
      - name: verify naming (含 CSS 大括号平衡 / 品牌 / 端口常量)
        run: node packages/app-shell/scripts/verify-naming.mjs
      - name: verify memory
        run: node packages/app-shell/scripts/verify-memory.mjs
      - name: verify router queue
        run: node packages/app-shell/scripts/verify-router-queue.mjs
      - name: verify tray/single-instance
        run: node packages/app-shell/scripts/verify-tray-quit.mjs
      - name: verify chat window
        run: node packages/app-shell/scripts/verify-chat-window.mjs
      - name: verify summary quality
        run: node packages/app-shell/scripts/verify-summary-quality.mjs
      # 真机（Electron + CDP）门禁需要下载 Electron 二进制，CI 里用 --ignore-scripts 跳过了，
      # 因此这两项在 CI 不跑；它们属于本地验收套件的一部分（见本文件顶部说明）。
      - run: node spikes/verify-all/run-full.mjs
