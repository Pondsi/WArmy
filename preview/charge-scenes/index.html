<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>牛马冲锋 · 十幕概念</title>
<style>
  :root {
    --accent: #e0a15c;
    --ink: #f3eadb;
    --dim: rgba(243, 234, 219, 0.62);
    --line: rgba(243, 234, 219, 0.16);
    --panel: rgba(6, 8, 12, 0.66);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; background: #03050a; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #03050a; }
  #scene {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center;
    image-rendering: pixelated; image-rendering: crisp-edges;
    display: block; background: #03050a;
  }
  #curtain {
    position: absolute; inset: 0; background: #03050a; z-index: 9; opacity: 0;
    pointer-events: none; transition: opacity .34s ease;
  }
  #curtain.is-on { opacity: 1; transition-duration: .1s; }

  .hud-top {
    position: absolute; inset: 0 0 auto 0; z-index: 5;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: clamp(14px, 2.2vw, 28px) clamp(16px, 2.6vw, 36px);
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; letter-spacing: .16em; }
  .brand-mark {
    font-weight: 800; font-size: 13px; padding: 5px 8px 4px;
    border: 1px solid var(--line); color: var(--accent);
    background: rgba(4, 6, 10, .45);
  }
  .brand-sub { font-size: 11px; color: var(--dim); letter-spacing: .2em; }
  .scene-top {
    flex: 1 1 auto; max-width: min(720px, 62vw); text-align: center;
    padding: 0 18px; pointer-events: none;
  }
  .kicker {
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
    color: var(--accent); font-size: 11px; letter-spacing: .26em; font-weight: 600;
  }
  .kicker em { color: var(--dim); font-style: normal; font-weight: 400; letter-spacing: .16em; }
  #sTitle {
    margin: 6px 0 0; font-size: clamp(21px, 2.2vw, 30px); line-height: 1.14;
    letter-spacing: .12em; font-weight: 700; text-shadow: 0 2px 18px rgba(0,0,0,.75);
  }
  #sSub {
    margin: 8px auto 0; max-width: 680px; font-size: clamp(10px, .86vw, 12px);
    line-height: 1.7; letter-spacing: .08em; color: var(--dim);
    text-shadow: 0 1px 10px rgba(0,0,0,.8);
  }
  .hud-actions { pointer-events: auto; display: flex; align-items: center; gap: 10px; }
  .key-hint { color: var(--dim); font-size: 10px; letter-spacing: .12em; }
  .ghost-btn {
    appearance: none; border: 1px solid var(--line); background: rgba(4, 6, 10, .45);
    color: var(--ink); font: inherit; font-size: 11px; letter-spacing: .14em;
    padding: 7px 10px; cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

  .chooser {
    position: absolute; left: 50%; bottom: clamp(12px, 2.4vh, 24px); transform: translateX(-50%);
    z-index: 6; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px;
    padding: 5px; max-width: min(1180px, calc(100vw - 20px));
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 16px 44px rgba(0,0,0,.45);
  }
  .chooser button {
    appearance: none; border: 0; background: transparent; color: var(--dim);
    font: inherit; font-size: 11.5px; letter-spacing: .1em; cursor: pointer;
    display: flex; align-items: center; gap: 7px; padding: 9px 12px;
    transition: color .18s ease, background .18s ease;
    white-space: nowrap;
  }
  .chooser button .num { color: var(--accent); font-size: 10px; letter-spacing: .08em; opacity: .85; }
  .chooser button:hover { color: var(--ink); background: rgba(255,255,255,.06); }
  .chooser button.is-on { color: #101014; background: var(--accent); }
  .chooser button.is-on .num { color: #101014; opacity: .62; }
  .chooser button:focus-visible, .ghost-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 980px) {
    .scene-top { max-width: 56vw; padding: 0 8px; }
    #sSub { display: none; }
    .brand-sub { display: none; }
    .key-hint { display: none; }
  }
  @media (max-width: 720px) {
    #sTitle { font-size: 17px; letter-spacing: .04em; }
    .kicker { font-size: 10px; }
    .chooser { width: calc(100vw - 16px); gap: 0; }
    .chooser button { flex: 1 1 19%; justify-content: center; padding: 8px 4px; font-size: 10px; letter-spacing: .02em; }
    .chooser button .num { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" aria-label="牛马冲锋像素动画"></canvas>

  <header class="hud-top">
    <div class="brand">
      <span class="brand-mark">WArmy</span>
      <span class="brand-sub">牛马冲锋 · 概念试验场</span>
    </div>
    <div class="scene-top">
      <div class="kicker"><span id="sIndex">01</span><em>/ 10 · 牛马冲锋</em></div>
      <h1 id="sTitle"></h1>
      <p id="sSub"></p>
    </div>
    <div class="hud-actions">
      <span class="key-hint">← → / 1–0 · F 全屏</span>
      <button class="ghost-btn" id="fsBtn" type="button">全屏 F</button>
    </div>
  </header>

  <nav class="chooser" id="chooser" aria-label="选择场景"></nav>
  <div id="curtain"></div>
</div>

<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>window.__chargeBoot();</script>
</body>
</html>
