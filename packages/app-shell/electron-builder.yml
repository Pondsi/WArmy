appId: com.pondsi.ccarmy
productName: CCArmy
copyright: Copyright © Pondsi
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!**/*.map"
asar: true
extraResources:
  - from: ../memory-os/dist
    to: memory-os/dist
  - from: ../memory-os/package.json
    to: memory-os/package.json
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
# HarmonyOS：Electron 无官方目标；可后续走 ArkTS/WebView 壳或侧载 Linux 兼容层（待评估）
publish: null
