appId: com.pondsi.warmy
productName: WARMY
copyright: Copyright (c) Pondsi
directories:
  # R162：**按版本分目录**。以前 80 多个版本的安装包全平铺在 release/ 里，
  # 新旧产物混在一起，很容易拿错包发布（R161 就是这么把坏包发出去的）。
  # electron-builder 对 directories.output 做宏展开（packager.js: expandMacro），
  # 所以 ${version} 在这里是有效的：产物落到 release/<版本>/。
  output: ../../release/${version}
  buildResources: build
files:
  - dist/**
  - assets/**
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**"
asar: false
npmRebuild: false
nodeGypRebuild: false
extraResources:
  # hash-wasm：纯 JS + WASM（无原生 binding），但 ESM 的 dist/auth-core.mjs 运行期
  # `import { argon2id } from 'hash-wasm'` 必须有真实的 node_modules 解析目标。
  # 主 files 规则排除了全部 node_modules，这里单独拎出来装到 resources/app/node_modules/。
  # extraResources 的 `to:` 相对于 resources/，所以 to=node_modules/hash-wasm
  # 落到 resources/app/node_modules/hash-wasm，正好在 auth-core.mjs 的向上解析链上。
  - from: node_modules/hash-wasm
    to: node_modules/hash-wasm
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/test/**"
      - "!**/*.test.*"
      - "!**/jest.config.*"
      - "!**/rollup.config.*"
      - "!**/biome.json"
      - "!src/**"
  # R257：diwen（迪文 npm 包，纯 ESM 零依赖，运行期入口即 src/）——同 hash-wasm 口径
  # 拎进 resources/app/node_modules/，打包态 import('diwen') 才有解析目标；不可排除 src。
  - from: node_modules/diwen
    to: node_modules/diwen
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/tests/**"
      - "!**/test/**"
  # R300：A2UI 官方协议/渲染依赖；主 files 排除 node_modules，必须平铺到运行时可解析链。
  - from: node_modules/@a2ui/agent
    to: node_modules/@a2ui/agent
  - from: node_modules/@a2ui/lit
    to: node_modules/@a2ui/lit
  - from: node_modules/@a2ui/web_core
    to: node_modules/@a2ui/web_core
  - from: ../../node_modules/.pnpm/antlr4ng@3.0.16/node_modules/antlr4ng
    to: node_modules/antlr4ng
  - from: ../../node_modules/.pnpm/@lit-labs+signals@0.3.0/node_modules/@lit-labs/signals
    to: node_modules/@lit-labs/signals
  - from: ../../node_modules/.pnpm/@lit-labs+ssr-dom-shim@1.6.0/node_modules/@lit-labs/ssr-dom-shim
    to: node_modules/@lit-labs/ssr-dom-shim
  - from: ../../node_modules/.pnpm/@lit+context@1.1.6/node_modules/@lit/context
    to: node_modules/@lit/context
  - from: ../../node_modules/.pnpm/@lit+reactive-element@2.1.2/node_modules/@lit/reactive-element
    to: node_modules/@lit/reactive-element
  - from: ../../node_modules/.pnpm/@preact+signals-core@1.14.5/node_modules/@preact/signals-core
    to: node_modules/@preact/signals-core
  - from: ../../node_modules/.pnpm/lit@3.3.3/node_modules/lit
    to: node_modules/lit
  - from: ../../node_modules/.pnpm/lit-element@4.2.2/node_modules/lit-element
    to: node_modules/lit-element
  - from: ../../node_modules/.pnpm/lit-html@3.3.3/node_modules/lit-html
    to: node_modules/lit-html
  - from: ../../node_modules/.pnpm/signal-polyfill@0.2.3/node_modules/signal-polyfill
    to: node_modules/signal-polyfill
  - from: ../../node_modules/.pnpm/signal-utils@0.21.1_signal-polyfill@0.2.3/node_modules/signal-utils
    to: node_modules/signal-utils
  - from: ../../node_modules/.pnpm/validate-color@2.2.4/node_modules/validate-color
    to: node_modules/validate-color
  - from: ../../node_modules/.pnpm/zod@3.25.76/node_modules/zod
    to: node_modules/zod
  - from: ../../node_modules/.pnpm/zod-to-json-schema@3.25.2_zod@3.25.76/node_modules/zod-to-json-schema
    to: node_modules/zod-to-json-schema
  # R259：DuckDB（native 只活在 duckdb-worker 子进程）——平铺三个包保证解析链。
  - from: ../../node_modules/.pnpm/@duckdb+node-api@2.0.0-r.1/node_modules/@duckdb/node-api
    to: node_modules/@duckdb/node-api
  - from: ../../node_modules/.pnpm/@duckdb+node-bindings@2.0.0-r.1/node_modules/@duckdb/node-bindings
    to: node_modules/@duckdb/node-bindings
  - from: ../../node_modules/.pnpm/@duckdb+node-bindings-win32-x64@2.0.0-r.1/node_modules/@duckdb/node-bindings-win32-x64
    to: node_modules/@duckdb/node-bindings-win32-x64
  - from: ../memory-os/dist
    to: memory-os/dist
  - from: ../memory-os/package.json
    to: memory-os/package.json
  - from: ../providers/dist
    to: warmy/providers/dist
  - from: ../providers/package.json
    to: warmy/providers/package.json
  - from: ../board/dist
    to: warmy/board/dist
  - from: ../board/package.json
    to: warmy/board/package.json
  - from: ../group-router/dist
    to: warmy/group-router/dist
  - from: ../group-router/package.json
    to: warmy/group-router/package.json
  - from: ../ccr-compressor/dist
    to: warmy/ccr-compressor/dist
  - from: ../ccr-compressor/package.json
    to: warmy/ccr-compressor/package.json
  - from: ../knowledge-base/dist
    to: warmy/knowledge-base/dist
  - from: ../knowledge-base/package.json
    to: warmy/knowledge-base/package.json
  - from: ../sync-protocol/dist
    to: warmy/sync-protocol/dist
  - from: ../sync-protocol/package.json
    to: warmy/sync-protocol/package.json
  - from: ../asset-governance/dist
    to: warmy/asset-governance/dist
  - from: ../asset-governance/package.json
    to: warmy/asset-governance/package.json
  - from: ../dsh-runtime/dist
    to: warmy/dsh-runtime/dist
  - from: ../dsh-runtime/package.json
    to: warmy/dsh-runtime/package.json
  - from: ../contracts/dist
    to: warmy/contracts/dist
  - from: ../contracts/package.json
    to: warmy/contracts/package.json
  - from: ../../node_modules/.pnpm
    to: pnpm-store
    filter:
      - "**/better-sqlite3/**"
      - "**/better-sqlite3-multiple-ciphers/**"
      - "**/bindings/**"
      - "**/file-uri-to-path/**"
  # 第 122 轮：dsh 运行时随项目携带（必装；设置页检测优先看 resources/warmy-dsh）
  - from: ../../spikes/spike-05-plugins/node_modules
    to: warmy-dsh/node_modules
  # R260 项10：TripoSR 推理脚本（单图→mesh，独立 Python 子进程跑；模型按需下载不随包）
  - from: resources/triposr-run.py
    to: warmy/triposr-run.py
  # R260 Docling 文档解析脚本（版面/表格保真；独立 Python 子进程，docling 按需安装）
  - from: resources/docling-run.py
    to: warmy/docling-run.py
  # R260 Tree-sitter AST 解析脚本（WASM 子进程，零原生；web-tree-sitter+grammar 按需安装）
  - from: resources/tree-sitter-run.mjs
    to: warmy/tree-sitter-run.mjs
  # R260 项27：MCP 桥接插件随包（打包态播种需 bridge.mjs；默认不启动，用户勾选才启用）
  - from: plugins/mcp-bridge
    to: plugins/mcp-bridge

# ── 应用图标（打包进 exe，任务栏/资源管理器都读它）──
win:
  icon: build/icon.ico
  artifactName: WArmy-Setup-${version}.exe
  # 记忆服务必须跑在真正的 Node 上（ADR 不变量 #4），所以把捆绑 Node 一起带上。
  # 只带当前平台，避免把另外 4 个平台的安装包也塞进去。
  extraResources:
    - from: ../../resources/node/win-x64
      to: node/win-x64
      filter:
        - node.exe
  target:
    - nsis

# 安装器：允许用户选择安装目录；运行期数据放在 <安装目录>\WArmyData。
# customRemoveFiles 在卸载/升级时先移出 WArmyData，避免把用户数据一起删掉。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  include: installer.nsh
mac:
  icon: build/icon.png
linux:
  icon: build/icon.png

# R162（D3-C）：声明发布渠道 ⇒ electron-builder 会额外生成 latest.yml（NSIS 更新清单）。
# 本仓的自动更新走自己的 Gengxinqi（https-only + 强制 sha256 + 安装前重算哈希），
# 不依赖 electron-updater；latest.yml 只是给「以后想换 electron-updater」留的兼容产物。
# 真正的增量更新靠 scripts/make-blocks.mjs 生成的 <安装包>.warmyblocks（固定 64 KiB 分块账）。
# 注意：这里只声明渠道，**不带 --publish 参数就不会真的上传**。
publish:
  provider: github
  owner: Pondsi
  repo: WArmy
  releaseType: release
