appId: com.pondsi.warmy
productName: 无限牛马
copyright: Copyright © Pondsi
directories:
  output: ../../release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**"
asar: false
npmRebuild: false
nodeGypRebuild: false
extraResources:
  - from: ../memory-os/dist
    to: memory-os/dist
  - from: ../memory-os/package.json
    to: memory-os/package.json
  - from: ../providers/dist
    to: warmy/providers/dist
  - from: ../providers/package.json
    to: warmy/providers/package.json
  - from: ../board/dist
    to: warmy/board/dist
  - from: ../board/package.json
    to: warmy/board/package.json
  - from: ../group-router/dist
    to: warmy/group-router/dist
  - from: ../group-router/package.json
    to: warmy/group-router/package.json
  - from: ../ccr-compressor/dist
    to: warmy/ccr-compressor/dist
  - from: ../ccr-compressor/package.json
    to: warmy/ccr-compressor/package.json
  - from: ../knowledge-base/dist
    to: warmy/knowledge-base/dist
  - from: ../knowledge-base/package.json
    to: warmy/knowledge-base/package.json
  - from: ../sync-protocol/dist
    to: warmy/sync-protocol/dist
  - from: ../sync-protocol/package.json
    to: warmy/sync-protocol/package.json
  - from: ../asset-governance/dist
    to: warmy/asset-governance/dist
  - from: ../asset-governance/package.json
    to: warmy/asset-governance/package.json
  - from: ../dsh-runtime/dist
    to: warmy/dsh-runtime/dist
  - from: ../dsh-runtime/package.json
    to: warmy/dsh-runtime/package.json
  - from: ../contracts/dist
    to: warmy/contracts/dist
  - from: ../contracts/package.json
    to: warmy/contracts/package.json
  - from: ../../node_modules/.pnpm
    to: pnpm-store
    filter:
      - "**/better-sqlite3/**"
      - "**/bindings/**"
      - "**/file-uri-to-path/**"

# ── 应用图标（打包进 exe，任务栏/资源管理器都读它）──
win:
  icon: build/icon.ico
  # 记忆服务必须跑在真正的 Node 上（ADR 不变量 #4），所以把捆绑 Node 一起带上。
  # 只带当前平台，避免把另外 4 个平台的安装包也塞进去。
  extraResources:
    - from: ../../resources/node/win-x64
      to: node/win-x64
      filter:
        - node.exe
  target:
    - nsis
mac:
  icon: build/icon.png
linux:
  icon: build/icon.png
