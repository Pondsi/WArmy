<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>WArmy 首启背景</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f6f1e8; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #f6f1e8; }
  #scene {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block; background: #f6f1e8;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="scene" aria-hidden="true"></canvas></div>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>window.__firstrunBoot();</script>
<script>
  /* 首启/登录页背景：?scenes=N（本次启动固定一幕）；?rotate=1 仅供调试轮播。 */
  (function () {
    const q = new URLSearchParams(location.search);
    const list = String(q.get('scenes') || '1')
      .split(',').map((n) => Number(n) - 1).filter((n) => n >= 0 && n <= 9);
    if (!list.length) return;
    window.__firstrun.select(list[0]);
    if (q.get('rotate') !== '1' || list.length < 2) return;
    const period = Math.max(4000, Number(q.get('period')) || 12000);
    let k = 0;
    setInterval(() => { k = (k + 1) % list.length; window.__firstrun.select(list[k]); }, period);
  })();
</script>
</body>
</html>
