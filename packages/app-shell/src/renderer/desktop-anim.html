<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;pointer-events:none;}
  #fx{position:fixed;inset:0;}
  .spr{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:10px;
    background:radial-gradient(circle at 35% 30%, #ffe9a8, #a87654 70%);box-shadow:0 4px 14px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;font-size:20px;}
  .spr.push{animation:push .9s ease;} .spr.shake{animation:shake .8s ease;} .spr.kick{animation:kick .9s ease;} .spr.squash{animation:squash 1s ease;}
  .spr.move{animation:moveA 1.2s ease;} .spr.create{animation:createA 1.1s ease;} .spr.delete{animation:deleteA 1.1s ease;} .spr.modify{animation:modifyA 1.2s ease;} .spr.open{animation:openA .9s ease;}
  .spr.fail{animation:failA .6s ease;background:radial-gradient(circle at 35% 30%, #ffd7d7, #c0392b 70%);}
  @keyframes push{0%{transform:translateX(0)}40%{transform:translateX(26px) rotate(8deg)}100%{transform:translateX(0)}}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}50%{transform:rotate(9deg)}75%{transform:rotate(-6deg)}}
  @keyframes kick{0%{transform:translate(0,0)}35%{transform:translate(18px,-22px) rotate(14deg)}70%{transform:translate(6px,4px)}100%{transform:translate(0,0)}}
  @keyframes squash{0%,100%{transform:scale(1,1)}40%{transform:scale(1.35,.6)}70%{transform:scale(.85,1.15)}}
  @keyframes moveA{0%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--dx),var(--dy));opacity:.9}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
  @keyframes createA{0%{transform:scale(0);opacity:0;filter:brightness(2)}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:0}}
  @keyframes deleteA{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  @keyframes modifyA{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg) scale(1.1)}60%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
  @keyframes openA{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);filter:brightness(1.6)}100%{transform:scale(1);opacity:0}}
  @keyframes failA{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
</style></head>
<body><div id="fx"></div>
<script>
  const fx = document.getElementById('fx');
  const dpr = window.devicePixelRatio || 1;
  let icons = [];
  let mimicOn = false, mimicFixed = false;
  async function load(){ try { const r = await window.warmyMimic.zhuoMianTuBiao(); icons = (r && r.icons) || []; } catch { icons = []; } }
  async function loadZt(){ try { const r = await window.warmyMimic.mimicZhuangTai(); mimicOn = !!(r && r.on); } catch { mimicOn = false; } try { const g = await window.warmyMimic.mimicGuDing?.(); mimicFixed = !!(g && g.fixed); } catch { mimicFixed = false; } }
  load(); loadZt(); setInterval(load, 15000); setInterval(loadZt, 5000);
  /* R264 项19：显隐/固定即时广播 —— 隐身瞬间清场停播，不等轮询 */
  try { window.warmyMimic.onMimicState?.((d) => { if (!d) return; mimicOn = !!d.on; if (typeof d.fixed === 'boolean') mimicFixed = d.fixed; if (!mimicOn) fx.innerHTML = ''; }); } catch { /* noop */ }
  function spr(x, y, cls, emoji, dx, dy){ const d = document.createElement('div'); d.className = 'spr ' + cls; d.textContent = emoji || '';
    d.style.left = (x / dpr) + 'px'; d.style.top = (y / dpr) + 'px'; if (dx !== undefined){ d.style.setProperty('--dx', (dx / dpr) + 'px'); d.style.setProperty('--dy', (dy / dpr) + 'px'); }
    fx.appendChild(d); setTimeout(() => d.remove(), 1400); }
  function centerOf(ic){ return { x: ic.rect.x + ic.rect.width / 2, y: ic.rect.y + ic.rect.height / 2 }; }
  // 平时纯视觉互动：R263/R264 仅当拟态可见且未固定才走到图标边＋手脚动作；隐藏/固定不互动
  setInterval(() => { if (!icons.length || !mimicOn || mimicFixed) return; const ic = icons[Math.floor(Math.random() * icons.length)]; const c = centerOf(ic);
    const kinds = ['push', 'shake', 'kick', 'squash']; const kind = kinds[Math.floor(Math.random() * 4)];
    try { window.warmyMimic?.mimicTuBiaoHuDong?.({ x: c.x, y: c.y, kind }); } catch { /* noop */ }
    spr(c.x, c.y, kind, ''); }, 12000);
  // 真实操作结果驱动动画（仅拟态可见时）
  window.warmyMimic.onZhuoMianDongHua((d) => { if (!d || !mimicOn) return;
    const ic = icons.find((i) => i.filePath === d.path); const c = ic ? centerOf(ic) : { x: innerWidth * dpr / 2, y: innerHeight * dpr / 2 };
    if (!d.ok) { spr(c.x, c.y, 'fail', '✕'); return; }
    const emo = { move: '➜', create: '✨', delete: '🗑', modify: '🔧', open: '📂' }[d.op] || '';
    let dx = 0, dy = 0;
    if (d.op === 'move') { dx = 120; dy = -60; }
    if (d.op === 'delete') { dx = 0; dy = 140; }
    spr(c.x, c.y, d.op, emo, dx, dy);
  });
</script></body></html>
