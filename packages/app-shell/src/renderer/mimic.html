<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>拟态</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none;
    -webkit-app-region: no-drag; font: 13px/1.5 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  #stage { position: relative; width: 100%; height: 100%; }
  /* 拟态本体：可拖动 */
  #pet { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 160px; height: 160px; cursor: grab; }
  #pet:active { cursor: grabbing; }
  /* 悬停（主进程命中测试通知；不用 :hover，因为穿透态下收不到可靠的 hover 事件） */
  #pet.xuanTing img { filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)) drop-shadow(0 0 10px rgba(120,190,255,.65)); }
  #pet img { width: 100%; height: 100%; object-fit: contain; pointer-events: none;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
  /* 漫画式对话框（字幕） */
  #bubble { position: absolute; left: 50%; bottom: 168px; transform: translateX(-50%);
    max-width: 260px; min-width: 90px; padding: 9px 13px; border-radius: 14px;
    background: rgba(255,255,255,.97); color: #1d2430; box-shadow: 0 6px 20px rgba(0,0,0,.28);
    display: none; word-break: break-word; }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
    border: 7px solid transparent; border-top-color: rgba(255,255,255,.97); border-bottom: 0; }
  #bubble.kai { display: block; }
  /* 状态小灯：语音模式可见 */
  #dot { position: absolute; left: 50%; bottom: 164px; transform: translateX(-50%);
    width: 8px; height: 8px; border-radius: 50%; background: #6fd18f; display: none; }
  #dot.kai { display: block; animation: tan 1.2s ease-in-out infinite; }
  @keyframes tan { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  /* R228 项3：右键 HTML 菜单（拟态窗内；展开时上报并集矩形防穿透） */
  #caiDan { position: absolute; z-index: 9; min-width: 150px; max-width: 224px;
    background: rgba(24,28,38,.96); border: 1px solid rgba(120,190,255,.35); border-radius: 10px;
    padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); color: #e8ecf4; font-size: 12px; }
  #caiDan .xiang { padding: 6px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #caiDan .xiang:hover { background: rgba(120,190,255,.22); }
  #caiDan .zi { padding: 2px 0 2px 10px; border-left: 2px solid rgba(120,190,255,.35); margin-left: 8px; }
  #caiDan .zi .xiang.on { color: #7ec8ff; }

  /* ══ R220：拟态动起来 —— 2D 常驻 idle（呼吸浮动 + 周期眨眼）+ 触发动作动画 ══ */
  @keyframes dzIdleHuXi {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    50%      { transform: translateY(-3px) scale(1.015, 0.985); }
  }
  @keyframes dzIdleZhaYan {
    0%, 92%, 100% { filter: none; }
    95%           { filter: brightness(1.06); transform: scaleY(0.94); }
    97%           { filter: none; }
  }
  #pet img {
    transform-origin: 50% 100%;
    animation: dzIdleHuXi 3.2s ease-in-out infinite, dzIdleZhaYan 5.7s linear infinite;
  }
  /* 兜底轻摆放前面（特异性低于具名规则，具名动作后定义者赢） */
  #pet img.dz2d[class*="dz-"] { animation: dzQingBai 1s ease-in-out 2; }
  @keyframes dzQingBai   { 0%,100%{ transform: rotate(0) translateY(0) } 35%{ transform: rotate(-5deg) translateY(-3px) } 70%{ transform: rotate(4deg) translateY(-1px) } }
  #pet img.dz2d.dz-kaiXin  { animation: dzKaixin .9s ease-in-out infinite; }
  @keyframes dzKaixin   { 0%,100%{ transform: translateY(0) rotate(0) } 30%{ transform: translateY(-8px) rotate(-4deg) } 60%{ transform: translateY(-4px) rotate(4deg) } }
  #pet img.dz2d.dz-yaoWei { animation: dzYaoWei 1s ease-in-out infinite; }
  @keyframes dzYaoWei   { 0%,100%{ transform: rotate(0) } 25%{ transform: rotate(-7deg) } 75%{ transform: rotate(7deg) } }
  #pet img.dz2d.dz-dianTou { animation: dzDianTou .8s ease-in-out 2; }
  @keyframes dzDianTou  { 0%,100%{ transform: rotate(0) } 50%{ transform: rotate(9deg) translateY(3px) } }
  #pet img.dz2d.dz-yaoTou { animation: dzYaoTou .8s ease-in-out 2; }
  @keyframes dzYaoTou   { 0%,100%{ transform: rotate(0) } 30%{ transform: rotate(-9deg) } 70%{ transform: rotate(9deg) } }
  #pet img.dz2d.dz-waiTou { animation: dzWaiTou 1s ease-in-out 2; }
  @keyframes dzWaiTou   { 0%,100%{ transform: rotate(0) } 50%{ transform: rotate(-12deg) } }
  #pet img.dz2d.dz-bengTiao { animation: dzBengTiao .7s ease-in-out 3; }
  @keyframes dzBengTiao { 0%,100%{ transform: translateY(0) } 40%{ transform: translateY(-16px) } 70%{ transform: translateY(0) scaleY(.92) } }
  #pet img.dz2d.dz-zhaoshou { animation: dzZhaoShou 1.1s ease-in-out 2; }
  @keyframes dzZhaoShou { 0%,100%{ transform: rotate(0) } 25%{ transform: rotate(-12deg) } 60%{ transform: rotate(10deg) } }
  #pet img.dz2d.dz-huiShou { animation: dzZhaoShou 1.1s ease-in-out 2; }
  #pet img.dz2d.dz-huanYing { animation: dzZhaoShou 1.1s ease-in-out 2; }
  #pet img.dz2d.dz-zhuanQuan { animation: dzZhuanQuan 1s ease-in-out 1; }
  @keyframes dzZhuanQuan { 0%{ transform: rotate(0) } 100%{ transform: rotate(360deg) } }
  #pet img.dz2d.dz-tiaoWu { animation: dzTiaoWu 1.2s ease-in-out infinite; }
  @keyframes dzTiaoWu  { 0%,100%{ transform: translateY(0) rotate(-5deg) } 50%{ transform: translateY(-10px) rotate(5deg) } }
  #pet img.dz2d.dz-guZhang { animation: dzGuZhang .6s ease-in-out 3; }
  @keyframes dzGuZhang  { 0%,100%{ transform: scale(1) } 50%{ transform: scale(1.08) } }
  #pet img.dz2d.dz-daHaQian { animation: dzDaHaQian 1.4s ease-in-out 1; }
  @keyframes dzDaHaQian { 0%,100%{ transform: scaleY(1) } 45%{ transform: scaleY(1.1) rotate(-4deg) } }
  #pet img.dz2d.dz-shenLan { animation: dzShenLan 1.4s ease-in-out 1; }
  @keyframes dzShenLan { 0%,100%{ transform: scale(1,1) } 40%{ transform: scale(1.06,1.12) translateY(-6px) } }
  #pet img.dz2d.dz-daGun { animation: dzDaGun 1.2s ease-in-out 1; }
  @keyframes dzDaGun    { 0%{ transform: rotate(0) } 100%{ transform: rotate(360deg) translateY(-4px) } }
  #pet img.dz2d.dz-paXia { animation: dzPaXia 1s ease-in-out 1 forwards; }
  @keyframes dzPaXia    { 100%{ transform: scaleY(.8) translateY(6px) } }
  #pet img.dz2d.dz-qiLi { animation: dzQiLi 1s ease-in-out 1; }
  @keyframes dzQiLi     { 0%{ transform: scaleY(.8) translateY(6px) } 100%{ transform: scaleY(1) translateY(0) } }
  #pet img.dz2d.dz-shuiJiao, #pet img.dz2d.dz-keShui { animation: dzShuiJiao 3s ease-in-out infinite; }
  @keyframes dzShuiJiao { 0%,100%{ transform: scaleY(1) rotate(0) } 50%{ transform: scaleY(.96) rotate(-3deg) } }
  /* R259 报障26：本体走到图标旁互动——走路步态 + 到达互动 */
  #pet img.dz-zouLu { animation: dzZouLu .5s ease-in-out infinite; }
  @keyframes dzZouLu { 0%,100%{ transform: translateY(0) rotate(-3deg) } 25%{ transform: translateY(-5px) rotate(0) } 50%{ transform: translateY(0) rotate(3deg) } 75%{ transform: translateY(-5px) rotate(0) } }
  #pet img.dz-huDong { animation: dzHuDong .65s ease-in-out 2; }
  @keyframes dzHuDong { 0%,100%{ transform: translateY(0) scale(1) } 35%{ transform: translateY(-12px) scale(1.06) rotate(-4deg) } 70%{ transform: translateY(0) scale(.96,.98) } }

</style>
</head>
<body>
  <div id="stage">
    <div id="dot"></div>
    <div id="bubble"></div>
    <div id="pet"><img id="tupian" alt=""/></div>
    <div id="caiDan" hidden></div>
  </div>
  <audio id="yinPin" hidden></audio>
  <script src="./vendor/three.bundle.min.js"></script>
  <script src="./mimic-render.js"></script>
  <script>
    const pet = document.getElementById('pet');
    const tupian = document.getElementById('tupian');
    const bubble = document.getElementById('bubble');
    const dot = document.getElementById('dot');

    // 主进程注入当前人物模型
    window.__setTi = (src) => { tupian.src = src || ''; };
    // 字幕：显示一段回复（漫画气泡），到时自动收起
    let zmTimer = 0;
    window.__shuo = (wen, ms) => {
      /* R228 项3：空文本 = 对话框关，立即收起气泡 */
      if (!String(wen || '').trim()) { bubble.classList.remove('kai'); return; }
      bubble.textContent = String(wen || '');
      bubble.classList.add('kai');
      clearTimeout(zmTimer);
      zmTimer = setTimeout(() => bubble.classList.remove('kai'), Number(ms) || Math.max(2600, String(wen || '').length * 140));
    };
    window.__dian = (on) => { dot.classList.toggle('kai', !!on); };

    // 拖动：按住拟态移动整个窗口（主进程用 win.setBounds，R226 跨屏保留）
    // R228 项2：左键单击=1次抚摸、双击=2次抚摸（不再开聊天）；按住不动=持续摸；按住移动=拖着摸(stroke)，都上报模型
    let dragging = false, sx = 0, sy = 0;
    let djX = 0, djY = 0, djShi = 0, holdMo = false, holdTimer = 0, yiDong = false;
    function moPartBu(e) {
      try {
        if (e && window.__mimicIs3D && window.__mimicIs3D()) {
          const bu = window.__mimicRaycast?.(e.clientX, e.clientY);
          if (bu) return bu;
        }
      } catch { /* noop */ }
      return '身体';
    }
    pet.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; /* 右键留给 3D 旋转/右键菜单 */
      dragging = true; sx = e.screenX; sy = e.screenY;
      djX = e.screenX; djY = e.screenY; djShi = Date.now(); holdMo = false; yiDong = false;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        if (dragging && !yiDong) { holdMo = true; try { window.warmyMimic?.moPart?.({ part: moPartBu(), kind: 'hold', ms: 0 }); } catch { /* noop */ } }
      }, 600);
      window.warmyMimic?.dragStart?.({ x: e.screenX, y: e.screenY });
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      if (Math.abs(e.screenX - djX) >= 5 || Math.abs(e.screenY - djY) >= 5) { yiDong = true; clearTimeout(holdTimer); }
      window.warmyMimic?.dragMove?.({ x: e.screenX, y: e.screenY });
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button !== 0 || !dragging) return;
      dragging = false; clearTimeout(holdTimer);
      window.warmyMimic?.dragEnd?.();
      const ms = Date.now() - djShi;
      try {
        if (yiDong) window.warmyMimic?.moPart?.({ part: '身体', kind: 'stroke', ms, from: { x: djX, y: djY }, to: { x: e.screenX, y: e.screenY } });
        else if (holdMo) window.warmyMimic?.moPart?.({ part: moPartBu(), kind: 'hold', ms });
        else if (ms <= 600) window.warmyMimic?.moPart?.({ part: moPartBu(e), kind: 'tap' }); /* 双击的两次 mouseup 各报一次 = 2 次抚摸 */
      } catch { /* noop */ }
      holdMo = false;
    });

    // 透传：主进程按 50ms 轮询屏幕光标 + 我们上报的"本体矩形"做命中测试
    // （**不用 mousemove/forward**：Windows 上 forward 的 hover 不可靠，见 electron #30808/#15376）
    let chuanTou = false;
    window.warmyMimic?.onHover?.((d) => {
      const shang = d && d.inside;
      chuanTou = !shang;
      pet.classList.toggle('xuanTing', !!shang);
      /* R228：菜单展开且光标真到过并集矩形后，离开 1.2s 自动收（穿透态收不到外部点击） */
      /* R232：独立菜单用失焦即时关闭，本体命中不再负责菜单寿命。 */
    });
    function shangBaoBenTi() {
      try {
        const r = pet.getBoundingClientRect();
        window.warmyMimic?.setBodyRect?.({ x: r.left, y: r.top, w: r.width, h: r.height });
      } catch { /* noop */ }
    }
    window.__shangBaoBenTi = shangBaoBenTi;
    window.addEventListener('resize', shangBaoBenTi);
    tupian.addEventListener('load', shangBaoBenTi);
    shangBaoBenTi();
    setTimeout(shangBaoBenTi, 300);

    // R228 项2：双击不再打开聊天（设定取消），两次 mouseup 各报一次抚摸（见上面左键逻辑）

    // ── R228 项3：右键按下无反应；按住可旋转 3D；松开时若没旋转 → 主进程弹原生菜单 ──
    pet.addEventListener('contextmenu', (e) => e.preventDefault());
    let xuanZhuanZhong = false, xzX = 0, xzY = 0, xuanZhuanGuo = false, youJian = false, yjX0 = 0, yjY0 = 0;
    pet.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        youJian = true; xuanZhuanGuo = false; yjX0 = e.screenX; yjY0 = e.screenY; xzX = e.screenX; xzY = e.screenY;
        if (window.__mimicIs3D && window.__mimicIs3D()) xuanZhuanZhong = true;
        e.preventDefault();
      }
    }, true);
    window.addEventListener('mousemove', (e) => {
      if (youJian && (Math.abs(e.screenX - yjX0) >= 5 || Math.abs(e.screenY - yjY0) >= 5)) xuanZhuanGuo = true;
      if (!xuanZhuanZhong) return;
      try { window.__mimicXuanZhuanBy?.(e.screenX - xzX, e.screenY - xzY); } catch { /* noop */ }
      xzX = e.screenX; xzY = e.screenY;
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button !== 2 || !youJian) return;
      youJian = false;
      if (xuanZhuanZhong) { xuanZhuanZhong = false; try { window.__mimicXuanZhuanJieShu?.(); } catch { /* noop */ } }
      /* R228：旋转过 → 不出菜单；没旋转 → HTML 菜单（对话框开关/隐身/窗口/语音互动模式/设置） */
      if (!xuanZhuanGuo) { void openCaiDan(e.clientX, e.clientY); }
    });

    // ── R228 项3：HTML 右键菜单 ──
    async function openCaiDan() {
      try { await window.warmyMimic?.caiDanXian?.(); } catch { /* 宿主拒绝时不打开残缺菜单 */ }
    }

    /* ── R275 设备仲裁：拟态优先级低于会话；被抢让出、会话用完归还后恢复 ── */
    let mimDaiBo = null;    // 排队/被抢中断的卡片播报（归还后补播）
    let mimDaiPlay = null;  // 排队/被抢中断的合成语音
    window.__mimSheBeiDeng = {};
    function mimSheBeiQing(device) {
      return new Promise((resolve) => {
        let yiJie = false;
        const jie = (v) => { if (!yiJie) { yiJie = true; resolve(v); } };
        window.__mimSheBeiDeng[device] = jie;
        window.warmyMimic?.sheBeiShenQing?.({ device, sid: '' }).then((r) => {
          /* R298 修复 R275 反接：立即授予⇒应播放（true）；旧代码 jie(false) 把获授的播报错误排队，
             卡片永远不读（探针超时根因）。被拒⇒等 grant 事件（ev.resume）再决。 */
          if (r && r.granted) { delete window.__mimSheBeiDeng[device]; jie(true); }
        }).catch(() => { delete window.__mimSheBeiDeng[device]; jie(true); /* 仲裁不可用不挡拟态 */ });
      });
    }
    function mimSheBeiFang(device) {
      try { delete window.__mimSheBeiDeng[device]; void window.warmyMimic?.sheBeiShiFang?.({ device }); } catch { /* noop */ }
    }
    window.warmyMimic?.onSheBeiShiJian?.((ev) => {
      const d = String((ev && ev.device) || '');
      if (!ev || !d) return;
      if (ev.type === 'grant') {
        const r = window.__mimSheBeiDeng[d];
        /* R298 修复 R275：grant＝设备已获授⇒应继续（true）。旧代码 r(!!ev.resume) 在新授予（resume=false）时
           与 invoke 响应竞态把 Promise 决成 false，播报/录音被错误排队永不执行。resume 只表“恢复被抢的使用”，不决定能否用。 */
        if (r) { delete window.__mimSheBeiDeng[d]; r(true); }
        if (d === 'mic') { try { tongBuYuYinMoShi(); } catch { /* noop */ } }
        if (d === 'speaker') {
          if (mimDaiBo) { const dd = mimDaiBo; mimDaiBo = null; void boKa(dd); }
          else if (mimDaiPlay) {
            const dd = mimDaiPlay; mimDaiPlay = null;
            try { const a = document.getElementById('yinPin'); if (a) { a.src = String(dd.dataUrl); a.play().catch(() => { /* noop */ }); } } catch { /* noop */ }
          }
        }
      } else if (ev.type === 'revoke') {
        if (d === 'mic') { try { guanLuYin(); } catch { /* noop */ } }
        if (d === 'speaker') {
          try { if (kaBoBaoZhong && kaDangQian) mimDaiBo = kaDangQian; } catch { /* noop */ }
          kaBoBaoZhong = false;
          window.speechSynthesis?.cancel();
          try { document.getElementById('yinPin').pause(); } catch { /* noop */ }
        }
      }
    });

    /* R232：系统语音播报卡片；播报期间停录且丢弃跨界分片，防自身声音变成授权。 */
    let kaYuYinToken = '', kaBoBaoZhong = false, kaBoBaoDai = 0, kaDangQian = null;
    async function boKa(d) {
      const dai = ++kaBoBaoDai;
      kaYuYinToken = ''; kaBoBaoZhong = !!d?.text;
      guanLuYin();
      window.speechSynthesis?.cancel();
      if (!d?.text) { kaBoBaoZhong = false; tongBuYuYinMoShi(); return; }
      kaDangQian = d;
      /* R275：扬声器仲裁——会话在用则让出/排队，归还后补播 */
      const huo = await mimSheBeiQing('speaker');
      if (!huo) { mimDaiBo = d; kaBoBaoZhong = false; return; }
      if (dai !== kaBoBaoDai) return;
      window.__shuo(d.text, 15000);
      if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) { kaBoBaoZhong = false; mimSheBeiFang('speaker'); return; }
      const ju = new SpeechSynthesisUtterance(String(d.text));
      ju.lang = d.locale || 'zh-CN';
      const voices = speechSynthesis.getVoices();
      const voice = voices.find((v) => v.lang === ju.lang) || voices.find((v) => v.lang.split('-')[0] === ju.lang.split('-')[0]);
      if (voice) ju.voice = voice;
      ju.onend = () => {
        if (dai !== kaBoBaoDai) return;
        kaYuYinToken = String(d.token || ''); kaBoBaoZhong = false; kaDangQian = null; mimSheBeiFang('speaker'); tongBuYuYinMoShi();
      };
      ju.onerror = () => { if (dai === kaBoBaoDai) { kaBoBaoZhong = false; kaYuYinToken = ''; mimSheBeiFang('speaker'); } };
      speechSynthesis.speak(ju);
    }
    window.warmyMimic?.onKaPian?.((d) => { void boKa(d); });

    // 主进程推来的说话/状态
    window.warmyMimic?.onSay?.((d) => window.__shuo(d && d.text, d && d.ms));
    /* R260：静音联动——「阅读回复」关时立即停掉当前卡片朗读/回复语音（字幕不受影响），并恢复录音 */
    window.warmyMimic?.onAutoReadBian?.((d) => {
      if (d && d.on === false) {
        kaBoBaoZhong = false; kaYuYinToken = '';
        window.speechSynthesis?.cancel();
        try { document.getElementById('yinPin').pause(); } catch { /* noop */ }
        mimSheBeiFang('speaker');
        tongBuYuYinMoShi();
      }
    });
    window.warmyMimic?.onDot?.((d) => window.__dian(d && d.on));
    window.warmyMimic?.onSetTi?.((d) => {
      /* R218：外观对象（{xingTai, zhuSe, fuSe, ...} 或 {src} 旧格式） → 2D/3D 渲染 */
      if (d && typeof d === 'object' && (d.xingTai || d.zhuSe || d.fuSe)) {
        window.__mimicWaiGuan(d, tupian);
      } else {
        window.__setTi(d && d.src);
      }
    });
    /* R218：动作触发（触发词 / AI 判断 / 事件） */
    window.warmyMimic?.onDongZuo?.((d) => { if (d && d.id) window.__mimicDongZuo(String(d.id)); });
    /* R260 拟态情绪反馈：情绪映射出的预设动作→播放（只映射已有动作，不臆造） */
    window.warmyMimic?.onQingXu?.((d) => { if (d && d.dongZuo) window.__mimicDongZuo(String(d.dongZuo)); });
    /* R259 报障26：本体走路/互动阶段（主进程驱动窗口移动，渲染层只负责步态/互动动画） */
    window.warmyMimic?.onZouLu?.((d) => {
      const ph = String((d && d.phase) || '');
      tupian.classList.remove('dz-zouLu', 'dz-huDong');
      if (ph === 'walk' || ph === 'back') { tupian.classList.add('dz-zouLu'); try { window.__mimicDongZuo('zouLu'); } catch { /* noop */ } }
      else if (ph === 'arrive') { tupian.classList.add('dz-huDong'); try { window.__mimicDongZuo(String((d && d.dongZuo) || 'tuiShou')); } catch { /* noop */ } }
      if (ph === 'arrive') window.__shuo({ open: '打开看看～', create: '放好啦～', delete: '收走啦～', modify: '改好～', move: '搬好～' }[String((d && d.op) || '')] || '到啦～', 1400);
    });
    /* R218：说话口型（语音合成/ASR 期间） */
    window.warmyMimic?.onKouXing?.((d) => window.__mimicKouXing(!!(d && d.on)));
    // 语音回复播放（主进程合成好的音频）
    window.warmyMimic?.onPlay?.((d) => {
      try {
        const a = document.getElementById('yinPin');
        if (!a || !d || !d.dataUrl) return;
        a.src = String(d.dataUrl);
        /* R275：扬声器仲裁——会话在用则排队，归还后播 */
        void mimSheBeiQing('speaker').then((huo) => {
          if (!huo) { mimDaiPlay = d; return; }
          a.play().catch(() => { /* 播放失败不影响字幕 */ });
        });
      } catch { /* noop */ }
    });

    // ── R218 语音互动：非 off 模式持续录音，每 2.5s 分片交给主进程 ASR/判断 ──
    let luYin = null;
    async function kaiShiLuYin() {
      if (luYin || kaBoBaoZhong || !document.getElementById('yinPin').paused) return;
      /* R275：麦克风仲裁——会话要用则让出；排队时等归还事件再进 */
      const huo = await mimSheBeiQing('mic');
      if (!huo) return;
      if (luYin || kaBoBaoZhong || !document.getElementById('yinPin').paused) { mimSheBeiFang('mic'); return; }
      const luYinDai = kaBoBaoDai;
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
        .then((stream) => {
          if (kaBoBaoZhong || luYinDai !== kaBoBaoDai || luYin) { stream.getTracks().forEach((track) => track.stop()); return; }
          let mime = 'audio/webm';
          try { mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm'; } catch { /* noop */ }
          const rec = new MediaRecorder(stream, { mimeType: mime });
          let kuai = [], luZhiKaToken = kaYuYinToken;
          rec.ondataavailable = (e) => { if (e.data && e.data.size) kuai.push(e.data); };
          rec.onstop = () => {
            if (!luYin || luYin.rec !== rec || kaBoBaoZhong || luYinDai !== kaBoBaoDai) { kuai = []; return; }
            const cardToken = luZhiKaToken;
            if (kuai.length) {
              const blob = new Blob(kuai, { type: rec.mimeType || 'audio/webm' });
              kuai = [];
              try {
                const fr = new FileReader();
                fr.onload = () => { try { window.warmyMimic?.yuYinFenPian?.({ dataUrl: String(fr.result), ext: 'webm', cardToken }); } catch { /* noop */ } };
                fr.readAsDataURL(blob);
              } catch { /* noop */ }
            }
            if (luYin && luYin.rec === rec && rec.state !== 'recording') { try { luZhiKaToken = kaYuYinToken; rec.start(); } catch { /* noop */ } }
          };
          rec.start();
          luYin = { stream, rec, timer: setInterval(() => { try { if (rec.state === 'recording') rec.stop(); } catch { /* noop */ } }, 2500) };
        })
        .catch(() => { /* 无麦克风授权：静默（不打扰拟态） */ mimSheBeiFang('mic'); });
    }
    function guanLuYin() {
      if (!luYin) return;
      clearInterval(luYin.timer);
      try { if (luYin.rec.state !== 'inactive') luYin.rec.stop(); } catch { /* noop */ }
      try { luYin.stream.getTracks().forEach((t) => t.stop()); } catch { /* noop */ }
      luYin = null;
    }
    function tongBuYuYinMoShi() {
      try {
        window.warmyMimic?.yuYinMoShiQu?.().then((r) => {
          const moShi = String((r && r.moShi) || 'off');
          if (moShi !== 'off') { kaiShiLuYin(); window.__dian(true); }
          else { guanLuYin(); mimSheBeiFang('mic'); window.__dian(false); }
        }).catch(() => { /* 查不到按 off */ });
      } catch { /* noop */ }
    }
    document.getElementById('yinPin').addEventListener('play', guanLuYin);
    document.getElementById('yinPin').addEventListener('ended', () => { mimSheBeiFang('speaker'); tongBuYuYinMoShi(); });
    document.getElementById('yinPin').addEventListener('error', tongBuYuYinMoShi);
    tongBuYuYinMoShi();
    setInterval(tongBuYuYinMoShi, 10000); // 设置页改模式后 10s 内生效
  </script>
</body>
</html>
