<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>拟态</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none;
    -webkit-app-region: no-drag; font: 13px/1.5 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  #stage { position: relative; width: 100%; height: 100%; }
  /* 桌宠本体：可拖动 */
  #pet { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 160px; height: 160px; cursor: grab; }
  #pet:active { cursor: grabbing; }
  /* 悬停（主进程命中测试通知；不用 :hover，因为穿透态下收不到可靠的 hover 事件） */
  #pet.xuanTing img { filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)) drop-shadow(0 0 10px rgba(120,190,255,.65)); }
  #pet img { width: 100%; height: 100%; object-fit: contain; pointer-events: none;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
  /* 漫画式对话框（字幕） */
  #bubble { position: absolute; left: 50%; bottom: 168px; transform: translateX(-50%);
    max-width: 260px; min-width: 90px; padding: 9px 13px; border-radius: 14px;
    background: rgba(255,255,255,.97); color: #1d2430; box-shadow: 0 6px 20px rgba(0,0,0,.28);
    display: none; word-break: break-word; }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
    border: 7px solid transparent; border-top-color: rgba(255,255,255,.97); border-bottom: 0; }
  #bubble.kai { display: block; }
  /* 状态小灯：语音模式可见 */
  #dot { position: absolute; left: 50%; bottom: 164px; transform: translateX(-50%);
    width: 8px; height: 8px; border-radius: 50%; background: #6fd18f; display: none; }
  #dot.kai { display: block; animation: tan 1.2s ease-in-out infinite; }
  @keyframes tan { 0%,100% { opacity:.35 } 50% { opacity:1 } }
</style>
</head>
<body>
  <div id="stage">
    <div id="dot"></div>
    <div id="bubble"></div>
    <div id="pet"><img id="tupian" alt=""/></div>
  </div>
  <script>
    const pet = document.getElementById('pet');
    const tupian = document.getElementById('tupian');
    const bubble = document.getElementById('bubble');
    const dot = document.getElementById('dot');

    // 主进程注入当前人物模型
    window.__setTi = (src) => { tupian.src = src || ''; };
    // 字幕：显示一段回复（漫画气泡），到时自动收起
    let zmTimer = 0;
    window.__shuo = (wen, ms) => {
      bubble.textContent = String(wen || '');
      bubble.classList.add('kai');
      clearTimeout(zmTimer);
      zmTimer = setTimeout(() => bubble.classList.remove('kai'), Number(ms) || Math.max(2600, String(wen || '').length * 140));
    };
    window.__dian = (on) => { dot.classList.toggle('kai', !!on); };

    // 拖动：按住桌宠移动整个窗口（主进程用 win.setBounds）
    let dragging = false, sx = 0, sy = 0;
    pet.addEventListener('mousedown', (e) => {
      dragging = true; sx = e.screenX; sy = e.screenY;
      window.warmyMimic?.dragStart?.({ x: e.screenX, y: e.screenY });
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      window.warmyMimic?.dragMove?.({ x: e.screenX, y: e.screenY });
    });
    window.addEventListener('mouseup', () => { dragging = false; window.warmyMimic?.dragEnd?.(); });

    // 透传：主进程按 50ms 轮询屏幕光标 + 我们上报的"本体矩形"做命中测试
    // （**不用 mousemove/forward**：Windows 上 forward 的 hover 不可靠，见 electron #30808/#15376）
    let chuanTou = false;
    window.warmyMimic?.onHover?.((d) => {
      const shang = d && d.inside;
      chuanTou = !shang;
      pet.classList.toggle('xuanTing', !!shang);
    });
    function shangBaoBenTi() {
      try {
        const r = pet.getBoundingClientRect();
        window.warmyMimic?.setBodyRect?.({ x: r.left, y: r.top, w: r.width, h: r.height });
      } catch { /* noop */ }
    }
    window.__shangBaoBenTi = shangBaoBenTi;
    window.addEventListener('resize', shangBaoBenTi);
    tupian.addEventListener('load', shangBaoBenTi);
    shangBaoBenTi();
    setTimeout(shangBaoBenTi, 300);

    // 双击桌宠 = 打开主窗口聊天
    pet.addEventListener('dblclick', () => { window.warmyMimic?.openChat?.(); });

    // 主进程推来的说话/状态
    window.warmyMimic?.onSay?.((d) => window.__shuo(d && d.text, d && d.ms));
    window.warmyMimic?.onDot?.((d) => window.__dian(d && d.on));
    window.warmyMimic?.onSetTi?.((d) => window.__setTi(d && d.src));
  </script>
</body>
</html>
