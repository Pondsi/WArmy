<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    用户默认头像 · 第 5 版（第 42 轮）

    要求：**最多 4 种颜色**；抽象；大气（"大道"）。

    构图 = 三个几何事实，没有第四个：
      ① 墨色底 #0C1418 —— 天
      ② 金色满环 #D9A441 —— 悬在路上的"日"，不与任何线相交
      ③ 象牙地平带 #EFE7D8 —— 地平线，压稳画面
      ④ 青灰大路 #6E8C99 —— 两条从地平线向远处收拢的粗线（灭点在环下），
         这条"路"就是"大道"：越远越窄，指向环心。
    无五官、无身体、无服饰、无象征、无禁止符号；纯几何，32px 仍清晰。
  -->
  <defs>
    <clipPath id="udd5clip"><circle cx="50" cy="50" r="50"/></clipPath>
  </defs>
  <g clip-path="url(#udd5clip)">
    <rect width="100" height="100" fill="#0C1418"/>

    <!-- 大道：两条从地平带向灭点收拢的粗线（左右对称，灭点在环心正下方） -->
    <path d="M14 84 L50 60" fill="none" stroke="#6E8C99" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M86 84 L50 60" fill="none" stroke="#6E8C99" stroke-width="4.6" stroke-linecap="round"/>

    <!-- 金色满环：悬在大道尽头之上 -->
    <circle cx="50" cy="37" r="17.5" fill="none" stroke="#D9A441" stroke-width="6.4"/>

    <!-- 象牙地平带 -->
    <path d="M0 84 H100" stroke="#EFE7D8" stroke-width="6.5" stroke-linecap="butt"/>
  </g>
</svg>
