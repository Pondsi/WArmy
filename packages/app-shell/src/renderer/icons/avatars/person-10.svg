<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 第 37 轮修订：人物头像第 10 张 —— 抽象的人（不表达性别/年龄/种族/职业/政治/宗教） -->
  <defs>
    <linearGradient id="p10bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F7E86"/>
      <stop offset="100%" stop-color="#123A45"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#p10bg)"/>
  <!-- 中性装饰：一道细弧 -->
  <path d="M20,74 Q50,54 80,74" fill="none" stroke="#9FE3E8" stroke-width="2.5" opacity="0.38" stroke-linecap="round"/>
  <!-- 人形：圆角方头 + 梯形肩 -->
  <rect x="34" y="21" width="32" height="32" rx="12" fill="#F3F1E9"/>
  <path d="M27,92 Q27,63 50,63 Q73,63 73,92 Z" fill="#F3F1E9" opacity="0.94"/>
  <!-- 一小点柔光，和纯几何形状区分 -->
