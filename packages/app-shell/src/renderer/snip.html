<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>截图</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: .95; pointer-events: none; }
  #kuang { position: absolute; border: 2px solid #ffd28a; box-shadow: 0 0 0 9999px rgba(0,0,0,.62); display: none; }
  .jiao { position: absolute; width: 14px; height: 14px; background: #ffd28a; border: 2px solid #fff; border-radius: 3px; z-index: 3; }
  .jiao[data-j="nw"] { left: -7px; top: -7px; cursor: nwse-resize; }
  .jiao[data-j="ne"] { right: -7px; top: -7px; cursor: nesw-resize; }
  .jiao[data-j="sw"] { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .jiao[data-j="se"] { right: -7px; bottom: -7px; cursor: nwse-resize; }
  .bian { position: absolute; z-index: 2; }
  .bian[data-b="n"] { left: 12px; right: 12px; top: -5px; height: 10px; cursor: ns-resize; }
  .bian[data-b="s"] { left: 12px; right: 12px; bottom: -5px; height: 10px; cursor: ns-resize; }
  .bian[data-b="w"] { top: 12px; bottom: 12px; left: -5px; width: 10px; cursor: ew-resize; }
  .bian[data-b="e"] { top: 12px; bottom: 12px; right: -5px; width: 10px; cursor: ew-resize; }
  #ti { position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
        background: rgba(0,0,0,.65); color: #fff; padding: 6px 14px; border-radius: 999px; font: 12px/1.4 sans-serif;
        pointer-events: none; }
  #bar {
    position: absolute; display: none; gap: 10px; align-items: center;
    background: rgba(0,0,0,.78); padding: 8px 12px; border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,.4); z-index: 5;
  }
  #bar button {
    border: none; border-radius: 7px; padding: 7px 16px; font: 13px/1.2 sans-serif;
    cursor: pointer; color: #fff;
  }
  #ok { background: #a78567; }
  #ok:hover { filter: brightness(1.1); }
  #cancel { background: #555; }
  #cancel:hover { background: #666; }
  #full { background: #3a3a3a; }
  #full:hover { background: #4a4a4a; }
</style>
</head>
<body>
  <img id="di" alt=""/>
  <div id="kuang">
    <div class="jiao" data-j="nw"></div><div class="jiao" data-j="ne"></div>
    <div class="jiao" data-j="sw"></div><div class="jiao" data-j="se"></div>
    <div class="bian" data-b="n"></div><div class="bian" data-b="s"></div>
    <div class="bian" data-b="w"></div><div class="bian" data-b="e"></div>
  </div>
  <div id="ti">拖动框选 → 可拉伸/移动 → 双击/确定＝截取选区 · 全屏请点「全屏」 · 右键/Esc＝取消</div>
  <div id="bar">
    <button id="full">全屏</button>
    <button id="cancel">取消</button>
    <button id="ok">确定</button>
  </div>
  <script>
    // 真·全屏截图遮罩：独立窗口，覆盖整个屏幕。
    // 交互（产品定稿）：拖动框选 → 保留选区并出「确定/取消」；**双击＝截取当前框选**（不是全屏）；
    // 全屏只走「全屏」按钮；右键/Esc＝取消。
    const di = document.getElementById('di');
    const kuang = document.getElementById('kuang');
    const bar = document.getElementById('bar');
    const ti = document.getElementById('ti');
    window.__setCap = (u) => { di.src = u || ''; };

    let x0 = 0, y0 = 0, x1 = 0, y1 = 0, tuo = false;
    let qu = null;               // 当前选区（null = 未选）
    let shangCiDianJi = 0;       // 双击判定
    let yiTiJiao = false;        // 防重复触发
    /** mode: 'draw'=新画 / 'move'=移动 / 'nw'|'ne'|'sw'|'se'|'n'|'s'|'w'|'e'=拉伸 */
    let mode = '';
    let moveOX = 0, moveOY = 0;
    let startQu = null;

    /** 判断点击位置：角/边/内部/外部 */
    function panDuan(e) {
      if (!qu || qu.w < 3 || qu.h < 3) return 'draw';
      const d = e.clientX, y = e.clientY;
      const inJ = (cx, cy) => Math.abs(d - cx) <= 14 && Math.abs(y - cy) <= 14;
      if (inJ(qu.x, qu.y)) return 'nw';
      if (inJ(qu.x + qu.w, qu.y)) return 'ne';
      if (inJ(qu.x, qu.y + qu.h)) return 'sw';
      if (inJ(qu.x + qu.w, qu.y + qu.h)) return 'se';
      const bs = 10;
      if (Math.abs(y - qu.y) <= bs && d >= qu.x && d <= qu.x + qu.w) return 'n';
      if (Math.abs(y - qu.y - qu.h) <= bs && d >= qu.x && d <= qu.x + qu.w) return 's';
      if (Math.abs(d - qu.x) <= bs && y >= qu.y && y <= qu.y + qu.h) return 'w';
      if (Math.abs(d - qu.x - qu.w) <= bs && y >= qu.y && y <= qu.y + qu.h) return 'e';
      if (d >= qu.x && d <= qu.x + qu.w && y >= qu.y && y <= qu.y + qu.h) return 'move';
      return 'draw';
    }

    function sheQu(r) {
      qu = r;
      x0 = r.x; y0 = r.y; x1 = r.x + r.w; y1 = r.y + r.h;
      hua();
    }

    function done(r) {
      if (yiTiJiao) return;
      yiTiJiao = true;
      try {
        bar.style.display = 'none';
        ti.textContent = '处理中…';
        // 必须走 invoke（见 snip-preload.cjs）；主进程收到后关闭本窗
        if (window.warmySnipDone) window.warmySnipDone(r);
      } catch (e) {
        yiTiJiao = false;
        ti.textContent = '截图失败：' + String(e && e.message || e);
      }
    }
    function hua() {
      const l = Math.min(x0, x1), t = Math.min(y0, y1);
      const w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
      kuang.style.display = (w < 3 && h < 3) ? 'none' : 'block';
      kuang.style.left = l + 'px'; kuang.style.top = t + 'px';
      kuang.style.width = w + 'px'; kuang.style.height = h + 'px';
    }
    /**
     * 操作条定位（产品要求）：**优先贴选区右下角**；
     * 下方放不下就翻到选区上方，右边放不下就左移，最后夹进视口。
     * 调整选框大小/移动位置时也会调用它 ⇒ 按钮组即时重定位。
     */
    function baiBar() {
      if (!qu || qu.w <= 0 || qu.h <= 0) return;
      bar.style.display = 'flex';
      bar.style.transform = 'none';
      const bw = bar.offsetWidth || 240;
      const bh = bar.offsetHeight || 46;
      const M = 8, GAP = 10;
      // 右下角：右边缘与选区右边缘对齐
      let left = qu.x + qu.w - bw;
      let top = qu.y + qu.h + GAP;
      if (top + bh > window.innerHeight - M) top = qu.y - bh - GAP;   // 下方不够 ⇒ 上方
      if (top < M) top = Math.min(window.innerHeight - bh - M, Math.max(M, qu.y + GAP));
      if (left + bw > window.innerWidth - M) left = window.innerWidth - bw - M;
      if (left < M) left = M;
      bar.style.left = left + 'px';
      bar.style.top = top + 'px';
    }

    // 选区定稿：显示操作条（贴在选区右下角）
    function dingGao() {
      const w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
      if (w < 3 && h < 3) {
        // 这次只是点了一下、没拖出框：保持已有选区（双击还要用它截图），
        // 一张都没有时也不在单击就当全屏 —— 全屏只走「全屏」按钮 / 确定。
        if (qu && qu.w > 0 && qu.h > 0) {
          baiBar();
          ti.textContent = '双击/确定＝截取选区 · 右键/Esc＝取消';
        } else {
          qu = null;
          bar.style.display = 'flex';
          bar.style.left = '50%';
          bar.style.top = '50%';
          bar.style.transform = 'translate(-50%,-50%)';
          ti.textContent = '请拖动框选 · 确定＝全屏 · 右键/Esc＝取消';
        }
        return;
      }
      qu = { x: Math.min(x0, x1), y: Math.min(y0, y1), w, h };
      baiBar();
      ti.textContent = '双击/确定＝截取选区 · 右键/Esc＝取消';
    }

    window.addEventListener('mousedown', (e) => {
      if (e.button === 2) return;
      if (e.target.closest('#bar')) return;
      const xia = Date.now();
      const shiShuangJi = (xia - shangCiDianJi) < 350;
      shangCiDianJi = xia;
      if (shiShuangJi) {
        if (qu && qu.w > 0 && qu.h > 0) done({ x: qu.x, y: qu.y, w: qu.w, h: qu.h });
        return;
      }
      mode = panDuan(e);
      tuo = true;
      if (mode === 'draw') {
        x0 = x1 = e.clientX; y0 = y1 = e.clientY;
        bar.style.display = 'none';
        hua();
      } else if (mode === 'move') {
        moveOX = e.clientX - qu.x; moveOY = e.clientY - qu.y;
      } else {
        startQu = { ...qu };
      }
      try { window.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch {}
    });
    window.addEventListener('mousemove', (e) => {
      if (!tuo) {
        // 光标提示
        const p = panDuan(e);
        const cs = { draw: 'crosshair', move: 'move', nw: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize', se: 'nwse-resize', n: 'ns-resize', s: 'ns-resize', w: 'ew-resize', e: 'ew-resize' };
        document.body.style.cursor = cs[p] || 'crosshair';
        return;
      }
      if (mode === 'draw') {
        x1 = e.clientX; y1 = e.clientY; hua();
      } else if (mode === 'move') {
        sheQu({ x: e.clientX - moveOX, y: e.clientY - moveOY, w: qu.w, h: qu.h });
        baiBar();
      } else if (startQu) {
        const sr = startQu;
        let { x, y, w, h } = sr;
        const dx = e.clientX - (mode.includes('w') ? sr.x : sr.x + sr.w);
        const dy = e.clientY - (mode.includes('n') ? sr.y : sr.y + sr.h);
        if (mode.includes('w')) { x = sr.x + dx; w = sr.w - dx; }
        if (mode.includes('e')) { w = sr.w + dx; }
        if (mode.includes('n')) { y = sr.y + dy; h = sr.h - dy; }
        if (mode.includes('s')) { h = sr.h + dy; }
        if (w < 3) w = 3;
        if (h < 3) h = 3;
        sheQu({ x, y, w, h });
        baiBar();
      }
    });
    window.addEventListener('mouseup', (e) => {
      if (!tuo) return;
      tuo = false;
      if (e.target.closest('#bar')) return;
      if (mode === 'draw') dingGao();
      // move/resize 松手不结束，继续调整
    });

    // 右键 = 取消
    window.addEventListener('contextmenu', (e) => { e.preventDefault(); done(null); });

    document.getElementById('ok').addEventListener('click', (e) => {
      e.stopPropagation();
      done(qu || { x: 0, y: 0, w: 0, h: 0 });
    });
    document.getElementById('cancel').addEventListener('click', (e) => {
      e.stopPropagation();
      done(null);
    });
    document.getElementById('full').addEventListener('click', (e) => {
      e.stopPropagation();
      done({ x: 0, y: 0, w: 0, h: 0 });
    });

    // Esc = 取消；回车 = 确定
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') done(null);
      else if (e.key === 'Enter') done(qu || { x: 0, y: 0, w: 0, h: 0 });
    });
  </script>
</body>
</html>
