<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>诊断日志</title>
<link rel="stylesheet" href="app.css"/>
<style>
  html,body{height:100%;margin:0;background:var(--bg,#f5f5f5);color:var(--ink,#191919);}
  #zdWrap{display:flex;flex-direction:column;height:100%;padding:14px 16px;box-sizing:border-box;gap:10px;}
  #zdHead{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  #zdHead h1{font-size:16px;margin:0;font-weight:650;}
  #zdHead .jingYin{font-size:11px;}
  #zdBtns{display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto;}
  #zdYuLan{flex:1 1 auto;min-height:0;overflow:auto;font-size:11px;line-height:1.6;white-space:pre-wrap;
    background:var(--card,#fff);border:1px solid var(--line,#e5e5e5);border-radius:8px;padding:10px;margin:0;
    font-family:var(--font-mono,Consolas,monospace);}
  #zdYuLan::-webkit-scrollbar{width:10px;}
  #zdYuLan::-webkit-scrollbar-track{background:var(--hover,#ececec);border-radius:8px;}
  #zdYuLan::-webkit-scrollbar-thumb{background:var(--accent,#A87654);border-radius:8px;border:2px solid var(--hover,#ececec);}
  #zdYuLan::-webkit-scrollbar-thumb:hover{background:var(--accent-ink,#8a5a38);}
  #zdZhuang{font-size:11px;color:var(--muted,#888);flex:0 0 auto;}
</style>
</head>
<body>
<div id="zdWrap">
  <div id="zdHead"><h1 id="zdTitle">诊断日志</h1><span class="jingYin" id="zdHint">只记脱敏事件，绝不上传。</span></div>
  <div id="zdBtns">
    <button class="anNiuXiao" id="zdView">刷新</button>
    <button class="anNiuXiao" id="zdSelf">立即自检</button>
    <button class="anNiuXiao" id="zdExport">导出（可对外）</button>
    <button class="anNiuXiao" id="zdClear">清空</button>
    <button class="anNiuXiao" id="zdToggle">记录：开</button>
  </div>
  <pre id="zdYuLan"></pre>
  <div id="zdZhuang"></div>
</div>
<script src="diag.js"></script>
</body>
</html>
